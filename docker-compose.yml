# Usage (on your PC, the "oracle node"):
#   docker compose run --rm ingest              # one-shot: seed SQLite + ingest the texts
#   docker compose up app                       # Streamlit UI on http://localhost:8501
#   docker compose up api                       # HTTP API on http://localhost:8000/api/docs
#   docker compose --profile ollama up          # + local LLM in a container (Ollama)
#   docker compose --profile tunnel up api tunnel   # expose the API through Cloudflare
#
# Public demo host (no GPU, no ML stack): only the `api-public` image, see README "Deployment".
x-delphi: &delphi
  build:
    context: .
    target: full
  image: delphi-oracle:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - delphi_storage:/app/storage # SQLite delphi.db
    - ./index:/app/index # Chroma + bm25.pkl
    - ./data/raw:/app/data/raw # downloaded source texts
    - hf_cache:/app/hf_cache # bge-m3 / reranker weights, downloaded once

services:
  app:
    <<: *delphi
    ports:
      - "8501:8501"
    environment:
      DB_PATH: /app/storage/delphi.db
      INDEX_DIR: /app/index
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

  # The API that answers questions (oracle_mode=local). Put ORACLE_TOKEN in .env before
  # exposing it through the tunnel: only your public API should be able to call it.
  api:
    <<: *delphi
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /app/storage/delphi.db
      INDEX_DIR: /app/index
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ORACLE_MODE: local
    command: ["delphi", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      start_period: 60s

  ingest:
    <<: *delphi
    profiles: ["ingest"]
    environment:
      DB_PATH: /app/storage/delphi.db
      INDEX_DIR: /app/index
    command: ["sh", "-c", "delphi seed && delphi ingest"]

  # Light public API (no torch/Chroma): encyclopedia + map, oracle forwarded to your PC.
  # Normally deployed on a hosting service; here for trying the whole chain locally.
  api-public:
    build:
      context: .
      target: api
    image: delphi-api:latest
    profiles: ["public"]
    ports:
      - "8080:8000"
    environment:
      ORACLE_MODE: remote
      ORACLE_BACKEND_URL: ${ORACLE_BACKEND_URL:-http://api:8000}
      ORACLE_TOKEN: ${ORACLE_TOKEN:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}

  # Cloudflare quick tunnel: prints a https://*.trycloudflare.com URL for the `api` service.
  # For a stable URL use a named tunnel (README "Deployment").
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    depends_on:
      - api

  # Local LLM. Pull the model once:
  #   docker compose --profile ollama run --rm ollama-pull
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit); remove this block for CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull $${LLM_MODEL:-hf.co/INSAIT-Institute/MamayLM-Gemma-3-12B-IT-v1.0-GGUF:Q4_K_M}"]
    env_file:
      - path: .env
        required: false
    depends_on:
      - ollama

volumes:
  delphi_storage:
  hf_cache:
  ollama_data:
