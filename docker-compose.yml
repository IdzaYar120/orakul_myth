# Usage:
#   docker compose run --rm ingest              # one-shot: seed SQLite (+ ingest texts from Stage 3)
#   docker compose up app                       # Streamlit on http://localhost:8501
#   docker compose --profile ollama up          # + local LLM in a container (Ollama)
x-delphi: &delphi
  build: .
  image: delphi-oracle:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - delphi_storage:/app/storage # SQLite delphi.db
    - ./index:/app/index # Chroma + bm25.pkl
    - ./data/raw:/app/data/raw # downloaded source texts
    - hf_cache:/app/hf_cache # bge-m3 / reranker weights, downloaded once

services:
  app:
    <<: *delphi
    ports:
      - "8501:8501"
    environment:
      DB_PATH: /app/storage/delphi.db
      INDEX_DIR: /app/index
      OLLAMA_BASE_URL: http://ollama:11434

  ingest:
    <<: *delphi
    profiles: ["ingest"]
    environment:
      DB_PATH: /app/storage/delphi.db
      INDEX_DIR: /app/index
    command: ["sh", "-c", "delphi seed && delphi ingest"]

  # Local LLM. Pull the model once:
  #   docker compose --profile ollama run --rm ollama-pull
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit); remove this block for CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull $${LLM_MODEL:-qwen2.5:7b}"]
    env_file:
      - path: .env
        required: false
    depends_on:
      - ollama

volumes:
  delphi_storage:
  hf_cache:
  ollama_data:
