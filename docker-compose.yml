services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DB_PATH=/app/delphi.db
      - INDEX_DIR=/app/index
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./index:/app/index
      - ./delphi.db:/app/delphi.db
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
