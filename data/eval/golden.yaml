# Golden set for RAG evaluation (`delphi eval`).
#
# Types: factual | multi_hop (two facts must be combined) | conflicting (the sources disagree —
# the answer must give both versions) | negative (trap: not in the sources, must be refused).
#
# expected_refs are POINT references into the corpus ("Apollod. 2.4.2", "Hes. Theog. 280",
# "Hom. Il. 18.478", "Hom. Hymn 4 Herm. 25", "Ap. Rhod. 1§3", "Paus. 10.16.3"); a question is
# a hit if any retrieved passage covers any of them. Every ref was checked against the
# ingested texts (2026-11-20); Apollonius uses book§paragraph of the Gutenberg text. Passages that
# answer the question equally well (Apollodorus' account of the Argonauts) were added after
# inspecting the retrieval misses.
# expected_facts are graded by the LLM judge (`delphi eval --judge`).

questions:
  # ------------------------------------------------------------------ factual: Apollodorus, Hesiod
  - id: q001
    question_uk: "Хто батьки Аполлона?"
    type: factual
    expected_entity_ids: [apollo]
    expected_refs: ["Hes. Theog. 918", "Apollod. 1.4.1", "Hom. Hymn 3 Ap. 15"]
    expected_facts: ["Батько Аполлона — Зевс", "Мати — Лето (Латона)"]

  - id: q002
    question_uk: "Де народився Аполлон?"
    type: factual
    expected_entity_ids: [apollo]
    expected_refs: ["Hom. Hymn 3 Ap. 15", "Hom. Hymn 3 Ap. 25", "Apollod. 1.4.1"]
    expected_facts: ["Аполлон народився на острові Делос", "Лето спиралася на гору Кінф біля пальми"]

  - id: q003
