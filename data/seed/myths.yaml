  cycle: argonauts
  summary_uk: Пелій послав Ясона по Золоте руно; на кораблі «Арго» герої пропливли повз Лемнос і Геллеспонт до Колхіди, де Медея допомогла Ясонові виконати завдання Еета і викрасти руно.
