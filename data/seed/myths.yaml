    - {entity_id: underworld, role: location}

- id: apotheosis_of_heracles
  title_uk: Смерть і обожнення Геракла
  cycle: heracles
  summary_uk: Отруєний сорочкою, просякнутою кров'ю кентавра, Геракл зійшов на багаття на горі Ета, був узятий на Олімп і одружився з Гебою.
  entities:
    - {entity_id: heracles, role: protagonist}
    - {entity_id: hebe, role: participant}
    - {entity_id: philoctetes, role: helper}
    - {entity_id: oeta, role: location}
    - {entity_id: olympus, role: location}

# --- Perseus
- id: perseus_and_medusa
  title_uk: Персей і Медуза
  cycle: perseus
  summary_uk: Акрісій кинув доньку Данаю з немовлям Персеєм у море в скрині; Персей виріс на Серіфі, а згодом з допомогою Афіни та Гермеса, вивідавши шлях у Граїй, відтяв голову Медузі, з тіла якої вийшли Пегас і Хрисаор.
  entities:
    - {entity_id: perseus, role: protagonist}
    - {entity_id: medusa, role: antagonist}
    - {entity_id: danae, role: participant}
    - {entity_id: acrisius, role: antagonist}
    - {entity_id: athena, role: helper}
    - {entity_id: hermes, role: helper}
    - {entity_id: graeae, role: participant}
    - {entity_id: pegasus, role: participant}
    - {entity_id: chrysaor, role: participant}
    - {entity_id: argos, role: location}
    - {entity_id: seriphos, role: location}

- id: perseus_and_andromeda
  title_uk: Персей і Андромеда
  cycle: perseus
  summary_uk: За похвальбу Кассіопеї Посейдон наслав на Ефіопію потвору; повертаючись із головою Медузи, Персей убив чудовисько, звільнив Андромеду і взяв її за дружину.
  entities:
    - {entity_id: perseus, role: protagonist}
    - {entity_id: andromeda, role: victim}
    - {entity_id: cassiopeia, role: participant}
    - {entity_id: poseidon, role: antagonist}

# --- Theseus
- id: theseus_and_minotaur
  title_uk: Тесей і Мінотавр
  cycle: theseus
  summary_uk: Тесей поплив на Крит серед юнаків, яких Афіни віддавали Мінотаврові; з ниткою Аріадни він убив чудовисько і вибрався з Лабіринту, але на Наксосі залишив царівну, а забувши змінити вітрило, спричинив загибель батька.
  entities:
    - {entity_id: theseus, role: protagonist}
    - {entity_id: minotaur, role: antagonist}
    - {entity_id: ariadne, role: helper}
    - {entity_id: minos, role: antagonist}
    - {entity_id: aegeus, role: participant}
    - {entity_id: daedalus, role: participant}
    - {entity_id: dionysus, role: participant}
    - {entity_id: athens, role: location}
    - {entity_id: knossos, role: location}
    - {entity_id: naxos, role: location}

- id: daedalus_and_icarus
  title_uk: Дедал та Ікар
  cycle: theseus
  summary_uk: Ув'язнені Міносом, Дедал та Ікар утекли з Криту на крилах із пір'я і воску; Ікар піднявся надто високо, віск розтанув, і юнак упав у море.
  entities:
    - {entity_id: daedalus, role: protagonist}
    - {entity_id: icarus, role: victim}
    - {entity_id: minos, role: antagonist}
    - {entity_id: crete, role: location}

