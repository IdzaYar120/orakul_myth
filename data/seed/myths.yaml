# Myth plots and narrative cycles.
# cycle: theogony | olympians | heracles | perseus | theseus | argonauts | theban | trojan | other
# role: protagonist | antagonist | helper | victim | participant | location | object

# --- Theogony
- id: creation
  title_uk: Постання світу
  cycle: theogony
  summary_uk: Першим постав Хаос, за ним Гея, Тартар і Ерос; з Хаосу народилися Ереб і Нікта, а Гея породила Небо — Урана.
  entities:
    - {entity_id: chaos, role: protagonist}
    - {entity_id: gaia, role: protagonist}
    - {entity_id: tartarus, role: participant}
    - {entity_id: eros, role: participant}
    - {entity_id: erebus, role: participant}
    - {entity_id: nyx, role: participant}
    - {entity_id: uranus, role: participant}

- id: castration_of_uranus
  title_uk: Повалення Урана
  cycle: theogony
  summary_uk: Гея дала Кроносові серп, і він оскопив батька Урана; з крові народилися Еринії, а з піни біля Кітери й Кіпру — Афродіта.
  entities:
    - {entity_id: cronus, role: protagonist}
    - {entity_id: uranus, role: victim}
    - {entity_id: gaia, role: helper}
    - {entity_id: erinyes, role: participant}
    - {entity_id: aphrodite, role: participant}
    - {entity_id: kythira, role: location}
    - {entity_id: cyprus, role: location}

- id: birth_of_zeus
  title_uk: Народження Зевса
  cycle: theogony
  summary_uk: Кронос ковтав своїх дітей, боячись пророцтва; Рея народила Зевса на Криті, а чоловікові дала проковтнути загорнутий у пелюшки камінь.
  entities:
    - {entity_id: zeus, role: protagonist}
    - {entity_id: rhea, role: helper}
    - {entity_id: cronus, role: antagonist}
    - {entity_id: gaia, role: helper}
    - {entity_id: crete, role: location}
    - {entity_id: dictaean_cave, role: location}

- id: titanomachy
  title_uk: Титаномахія
  cycle: theogony
  summary_uk: Десятирічна війна олімпійців з Олімпу проти титанів з Отрісу; з допомогою кіклопів і гекатонхейрів Зевс переміг і скинув титанів у Тартар.
  entities:
    - {entity_id: zeus, role: protagonist}
    - {entity_id: cronus, role: antagonist}
    - {entity_id: cyclopes, role: helper}
    - {entity_id: hecatoncheires, role: helper}
    - {entity_id: atlas, role: antagonist}
    - {entity_id: tartarus, role: location}
    - {entity_id: olympus, role: location}
    - {entity_id: othrys, role: location}

- id: typhonomachy
  title_uk: Битва Зевса з Тифоном
  cycle: theogony
  summary_uk: Гея породила від Тартара Тифона, що кинув виклик Зевсові; громовержець переміг його блискавками і скинув у Тартар (за пізнішими авторами — під Етну).
  entities:
    - {entity_id: zeus, role: protagonist}
    - {entity_id: typhon, role: antagonist}
    - {entity_id: gaia, role: participant}
    - {entity_id: etna, role: location}

- id: prometheus_and_pandora
  title_uk: Прометей і Пандора
  cycle: theogony
  summary_uk: Прометей ошукав Зевса під час жертвопринесення й викрав людям вогонь; Зевс прикув його до скелі, а людям послав Пандору з посудиною бід.
  entities:
    - {entity_id: prometheus, role: protagonist}
    - {entity_id: zeus, role: antagonist}
    - {entity_id: epimetheus, role: participant}
    - {entity_id: pandora, role: participant}
    - {entity_id: pandoras_box, role: object}
    - {entity_id: hephaestus, role: participant}
    - {entity_id: athena, role: participant}
    - {entity_id: heracles, role: helper}
    - {entity_id: caucasus, role: location}

- id: deucalion_flood
  title_uk: Потоп Девкаліона
  cycle: theogony
  summary_uk: Зевс наслав потоп на людей мідного віку; Девкаліон і Пірра врятувалися в скрині, пристали до Парнасу і відродили людство, кидаючи каміння через плече.
  entities:
    - {entity_id: deucalion, role: protagonist}
    - {entity_id: pyrrha, role: protagonist}
    - {entity_id: zeus, role: antagonist}
    - {entity_id: prometheus, role: helper}
    - {entity_id: parnassus, role: location}

# --- Olympians
- id: birth_of_athena
  title_uk: Народження Афіни
  cycle: olympians
  summary_uk: Зевс проковтнув вагітну Метіду, щоб її син не скинув його; згодом Афіна в повному обладунку вийшла з голови батька.
  entities:
    - {entity_id: athena, role: protagonist}
    - {entity_id: zeus, role: participant}
    - {entity_id: metis, role: participant}
    - {entity_id: hephaestus, role: helper}

- id: birth_of_apollo
  title_uk: Народження Аполлона та Артеміди
  cycle: olympians
  summary_uk: Переслідувана гнівом Гери, Лето ніде не могла народити, доки її не прийняв острів Делос.
  entities:
    - {entity_id: leto, role: protagonist}
    - {entity_id: apollo, role: participant}
    - {entity_id: artemis, role: participant}
    - {entity_id: hera, role: antagonist}
    - {entity_id: eileithyia, role: helper}
    - {entity_id: delos, role: location}

- id: apollo_python_delphi
  title_uk: Аполлон, Піфон і заснування Дельф
  cycle: olympians
  summary_uk: Аполлон убив змія Піфона під Парнасом і заснував там свій оракул; жриця-пророчиця дістала ім'я Піфії.
  entities:
    - {entity_id: apollo, role: protagonist}
    - {entity_id: python, role: antagonist}
    - {entity_id: delphi, role: location}
    - {entity_id: parnassus, role: location}

- id: abduction_of_persephone
  title_uk: Викрадення Персефони
  cycle: olympians
  summary_uk: Аїд з дозволу Зевса викрав Персефону; Деметра в горі шукала доньку, і земля перестала родити, доки Персефона не стала повертатися до матері на частину року.
  entities:
    - {entity_id: persephone, role: victim}
    - {entity_id: hades, role: antagonist}
    - {entity_id: demeter, role: protagonist}
    - {entity_id: zeus, role: participant}
    - {entity_id: hecate, role: helper}
    - {entity_id: helios, role: helper}
    - {entity_id: hermes, role: helper}
    - {entity_id: eleusis, role: location}
    - {entity_id: underworld, role: location}

- id: hermes_cattle
  title_uk: Гермес краде корів Аполлона
  cycle: olympians
  summary_uk: Новонароджений Гермес вибрався з колиски на Кіллені, викрав корів Аполлона і винайшов ліру, яку віддав братові на примирення.
  entities:
    - {entity_id: hermes, role: protagonist}
    - {entity_id: apollo, role: participant}
    - {entity_id: maia, role: participant}
    - {entity_id: zeus, role: participant}
    - {entity_id: cyllene, role: location}

# --- Heracles
- id: birth_of_heracles
  title_uk: Народження Геракла
  cycle: heracles
  summary_uk: Зевс прийшов до Алкмени в подобі її чоловіка Амфітріона; Гера затримала пологи, щоб першим народився Еврістей і отримав владу над Гераклом.
