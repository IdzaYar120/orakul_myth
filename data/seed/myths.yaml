# --- Theban cycle
- id: founding_of_thebes
  title_uk: Кадм і заснування Фів
  cycle: theban
  summary_uk: Шукаючи викрадену сестру Європу, Кадм за порадою Дельфійського оракула пішов за коровою, убив змія Ареса, посіяв його зуби і заснував Фіви, взявши за дружину Гармонію.
  entities:
    - {entity_id: cadmus, role: protagonist}
    - {entity_id: europa, role: participant}
    - {entity_id: harmonia, role: participant}
    - {entity_id: ares, role: antagonist}
    - {entity_id: athena, role: helper}
    - {entity_id: delphi, role: location}
    - {entity_id: thebes, role: location}

- id: birth_of_dionysus
  title_uk: Народження Діоніса
  cycle: theban
  summary_uk: Підмовлена Герою, Семела попросила Зевса з'явитися в справжній подобі й згоріла; Зевс доносив немовля Діоніса у своєму стегні.
  entities:
    - {entity_id: dionysus, role: protagonist}
    - {entity_id: semele, role: victim}
    - {entity_id: zeus, role: participant}
    - {entity_id: hera, role: antagonist}
    - {entity_id: thebes, role: location}

- id: oedipus
  title_uk: Едіп
  cycle: theban
  summary_uk: Покинутий немовлям на Кіфероні, Едіп виріс у Коринфі, дорогою до Фів убив батька Лаія, розгадав загадку Сфінкс і одружився з матір'ю Йокастою, а дізнавшись правду, осліпив себе.
  entities:
    - {entity_id: oedipus, role: protagonist}
    - {entity_id: laius, role: victim}
    - {entity_id: jocasta, role: participant}
    - {entity_id: sphinx, role: antagonist}
    - {entity_id: tiresias, role: participant}
    - {entity_id: antigone, role: participant}
    - {entity_id: delphi, role: location}
    - {entity_id: cithaeron, role: location}
    - {entity_id: corinth, role: location}
    - {entity_id: thebes, role: location}

