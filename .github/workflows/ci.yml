name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ml --extra ui  # ml: RAG tests, ui: Streamlit smoke tests

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the public API image (no ML stack)
        run: docker build --target api -t delphi-api:ci .

      - name: Public API answers /api/health
        run: |
          docker run -d --name api -p 8000:8000 -e ORACLE_BACKEND_URL=http://127.0.0.1:9 delphi-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/entities/zeus | grep -q '"name_en":"Zeus"'
          docker images delphi-api:ci --format 'api image: {{.Size}}'

      - name: Build the full image
        run: docker build --target full -t delphi-oracle:ci .

      - name: Seed DB inside the full image
        run: docker run --rm delphi-oracle:ci delphi seed
