[project]
name = "delphi-oracle"
version = "0.1.0"
description = "Дельфійський оракул — RAG-чат та енциклопедія давньогрецької міфології"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.67.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "sqlmodel>=0.0.19",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.8.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-ollama>=0.1.0",
]

[project.optional-dependencies]
ml = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
eval = [
    "ragas>=0.1.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=3.7.0",
]

[project.scripts]
delphi = "delphi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delphi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
